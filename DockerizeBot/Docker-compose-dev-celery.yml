version: '3.8'

services:
  db:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_DB: multi_time_frame
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - .postgres/DATA:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  django:
    build:
      context: .
      dockerfile: ./docker/dev/django/Dockerfile
    command: >
     sh -c "python manage.py migrate &&
            python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./app:/usr/src/app
    ports:
      - "8000:8000"
    env_file:
      - ./envs/dev/.env
    depends_on:
      - db
      - redis
    working_dir: /usr/src/app

  celery_worker:
    build:
      context: .
      dockerfile: ./docker/dev/django/Dockerfile
    command: celery -A multi_time_frame_django worker --loglevel=info
    volumes:
      - ./app:/usr/src/app
    env_file:
      - ./envs/dev/.env
    depends_on:
      - django
      - redis

  celery_beat:
    build:
      context: .
      dockerfile: ./docker/dev/django/Dockerfile
    command: celery -A multi_time_frame_django beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ./app:/usr/src/app
    env_file:
      - ./envs/dev/.env
    depends_on:
      - django
      - redis

  flower:
    image: mher/flower
    command: flower --broker=redis://redis:6379/0
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - celery_worker
